services:
  snippet-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_username
        - github_token

    ports:
      - "${SNIPPET_SERVICE_PORT}:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"
      PERMISSION_SERVICE_URL: "http://snippet-permission-service:8080"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID}"
      AUTH0_M2M_CLIENT_SECRET: "${AUTH0_M2M_CLIENT_SECRET}"
      ENGINE_URL: "${ENGINE_URL:-http://engine-proxy:80}"

    # `default` must be listed, or the service would leave the compose network; `snippet-searcher` is
    # where printscript-engine's compose puts its `engine-proxy`
    networks:
      - default
      - snippet-searcher

    depends_on:
      - postgres
      - azurite
      - snippet-permission-service

  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:-ghcr.io/ingsis-bry/snippet-permission-service:latest}"

    environment:
      DB_HOST: snippet-permission-db
      DB_PORT: "5432"
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"

    depends_on:
      - snippet-permission-db

  snippet-permission-db:
    image: postgres:17

    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD}"

    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    restart: unless-stopped
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --location /workspace
    ports:
      - "${AZURITE_PORT}:10000"
    volumes:
      - azurite-data:/workspace

networks:
  # created by printscript-engine's compose (start it first)
  snippet-searcher:
    external: true
    name: snippet-searcher

volumes:
  postgres-data:
  azurite-data:
  snippet-permission-db-data:

secrets:
  github_username:
    environment: USERNAME
  github_token:
    environment: TOKEN