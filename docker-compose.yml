# The API and the worker are the same image with the same configuration; only the Spring profile differs.
x-snippet-service-environment: &snippet-service-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"
  PERMISSION_SERVICE_URL: "http://snippet-permission-service:8080"
  AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
  AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
  AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID}"
  AUTH0_M2M_CLIENT_SECRET: "${AUTH0_M2M_CLIENT_SECRET}"
  ENGINE_URL: "${ENGINE_URL:-http://engine-proxy:80}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  # New Relic Logs in Context
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED: "10000"

services:
  snippet-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_username
        - github_token

    ports:
      - "${SNIPPET_SERVICE_PORT}:8080"

    environment:
      <<: *snippet-service-environment
      SPRING_PROFILES_ACTIVE: api

    # `default` must be listed, or the service would leave the compose network; `snippet-searcher` is
    # where printscript-engine's compose puts its `engine-proxy`
    networks:
      - default
      - snippet-searcher

    depends_on:
      - postgres
      - azurite
      - redis
      - snippet-permission-service

  # Same image as snippet-service, profile `worker`: consumes the `snippet.analysis` stream (lint, format,
  # tests, re-validation on a new parser). No HTTP server, so no ports.
  snippet-worker:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_username
        - github_token

    environment:
      <<: *snippet-service-environment
      SPRING_PROFILES_ACTIVE: worker

    networks:
      - default
      - snippet-searcher

    depends_on:
      - postgres
      - azurite
      - redis

    # lets the consumer finish the job in hand (it checks for a stop every 2 s)
    stop_grace_period: 30s

  # Redis Streams for the background jobs; append-only file so queued jobs survive a restart
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data

  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:-ghcr.io/ingsis-bry/snippet-permission-service:latest}"

    environment:
      DB_HOST: snippet-permission-db
      DB_PORT: "5432"
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"

    depends_on:
      - snippet-permission-db

  snippet-permission-db:
    image: postgres:17

    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD}"

    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    restart: unless-stopped
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --location /workspace
    ports:
      - "${AZURITE_PORT}:10000"
    volumes:
      - azurite-data:/workspace

networks:
  # created by printscript-engine's compose (start it first)
  snippet-searcher:
    external: true
    name: snippet-searcher

volumes:
  postgres-data:
  redis-data:
  azurite-data:
  snippet-permission-db-data:

secrets:
  github_username:
    environment: USERNAME
  github_token:
    environment: TOKEN