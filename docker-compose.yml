services:
  snippet-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_username
        - github_token

    ports:
      - "${SNIPPET_SERVICE_PORT}:8080"

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"

    depends_on:
      - postgres
      - azurite

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    restart: unless-stopped
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --location /workspace
    ports:
      - "${AZURITE_PORT}:10000"
    volumes:
      - azurite-data:/workspace

volumes:
  postgres-data:
  azurite-data:

secrets:
  github_username:
    environment: USERNAME
  github_token:
    environment: TOKEN