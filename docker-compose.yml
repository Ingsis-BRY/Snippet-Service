services:
  snippet-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_username
        - github_token

    ports:
      - "${SNIPPET_SERVICE_PORT}:8080"

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

secrets:
  github_username:
    environment: USERNAME
  github_token:
    environment: TOKEN