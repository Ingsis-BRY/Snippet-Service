name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ingsis-bry/snippet-service

jobs:
  # The same checks as CI.yml: an image is only published from a commit
  # whose tests, ktlint and detekt pass.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run check
        run: ./gradlew check
        env:
          USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  publish:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ingsis-bry/snippet-service:latest
            ghcr.io/ingsis-bry/snippet-service:${{ github.sha }}
          secrets: |
            github_username=${{ secrets.GH_PACKAGES_USERNAME }}
            github_token=${{ secrets.GH_PACKAGES_TOKEN }}

  deploy-dev:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Ask the infra repository to deploy this image to dev
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        shell: bash
        run: |
          gh workflow run deploy-service.yml \
            --repo Ingsis-BRY/snippet-searcher-infra \
            --ref dev \
            -f service="${IMAGE_NAME#*/}" \
            -f image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"