spring:
  datasource:
    url: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

permission-service:
  url: "${PERMISSION_SERVICE_URL:http://snippet-permission-service:8080}"
